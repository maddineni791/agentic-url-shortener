services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agentic-postgres-data:/var/lib/postgresql/data

  orchestrator-a:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENTIC_DB_URL: jdbc:postgresql://postgres:5432/agentic
      AGENTIC_DB_USERNAME: agentic
      AGENTIC_DB_PASSWORD: agentic
      AGENTIC_MODEL_PROVIDER: deterministic
      AGENTIC_WORKSPACE_ROOT: /app/workspaces
      AGENTIC_URL_REGION_PREFIX: us
      AGENTIC_BLOCKED_HOSTS: blocked.example
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agentic-workspaces:/app/workspaces

  orchestrator-b:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENTIC_DB_URL: jdbc:postgresql://postgres:5432/agentic
      AGENTIC_DB_USERNAME: agentic
      AGENTIC_DB_PASSWORD: agentic
      AGENTIC_MODEL_PROVIDER: deterministic
      AGENTIC_WORKSPACE_ROOT: /app/workspaces
      AGENTIC_URL_REGION_PREFIX: eu
      AGENTIC_BLOCKED_HOSTS: blocked.example
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agentic-workspaces:/app/workspaces

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/agentic-recording-rules.yml:/etc/prometheus/agentic-recording-rules.yml:ro

volumes:
  agentic-postgres-data:
  agentic-workspaces:
