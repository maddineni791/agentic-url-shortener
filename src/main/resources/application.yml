spring:
  application:
    name: agentic-sdlc-platform
  datasource:
    url: ${AGENTIC_DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${AGENTIC_DB_USERNAME:agentic}
    password: ${AGENTIC_DB_PASSWORD:agentic}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
