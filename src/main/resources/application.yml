spring:
  application:
    name: agentic-sdlc-platform
  datasource:
    url: ${AGENTIC_DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${AGENTIC_DB_USERNAME:agentic}
    password: ${AGENTIC_DB_PASSWORD:agentic}
  flyway:
    enabled: true

agentic:
  url-shortener:
    region-prefix: ${AGENTIC_URL_REGION_PREFIX:us}
    default-ttl: ${AGENTIC_URL_DEFAULT_TTL:30d}
    code-length: ${AGENTIC_URL_CODE_LENGTH:8}
    rate-limit-per-minute: ${AGENTIC_URL_RATE_LIMIT_PER_MINUTE:60}
    redirect-event-retention: ${AGENTIC_REDIRECT_EVENT_RETENTION:90d}
    inactive-url-retention: ${AGENTIC_INACTIVE_URL_RETENTION:30d}
    blocked-hosts: ${AGENTIC_BLOCKED_HOSTS:}
  model:
    provider: ${AGENTIC_MODEL_PROVIDER:deterministic}
    timeout: ${AGENTIC_MODEL_TIMEOUT:PT20S}
    max-input-chars: ${AGENTIC_MODEL_MAX_INPUT_CHARS:20000}
    max-output-chars: ${AGENTIC_MODEL_MAX_OUTPUT_CHARS:20000}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
