spring:
  application:
    name: agentic-sdlc-platform
  datasource:
    url: ${AGENTIC_DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${AGENTIC_DB_USERNAME:agentic}
    password: ${AGENTIC_DB_PASSWORD:agentic}
  flyway:
    enabled: true

agentic:
  model:
    provider: ${AGENTIC_MODEL_PROVIDER:deterministic}
    timeout: ${AGENTIC_MODEL_TIMEOUT:PT20S}
    max-input-chars: ${AGENTIC_MODEL_MAX_INPUT_CHARS:20000}
    max-output-chars: ${AGENTIC_MODEL_MAX_OUTPUT_CHARS:20000}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
