spring:
  datasource:
    url: jdbc:h2:mem:agentic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
agentic:
  orchestration:
    recovery-scheduled: false
  url-shortener:
    rate-limit-per-minute: 100
    blocked-hosts:
      - blocked.example
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
